<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="iyan-nekib">
  <!-- The site's own mark: the cat-bear from the home screen, on the
       terminal background. The extrusion it has in the header is left
       off on purpose — at 16px a stacked offset reads as mud, so this
       keeps only the gradient face and lets the silhouette do the work.
       The eyes and muzzle are holes (fill-rule), so the tile shows
       through them and the shape still reads when it is tiny. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#4a7fe8"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="#1d1e23"/>

  <g transform="translate(7.7 20.9) scale(5.286)">
    <path fill="url(#g)" fill-rule="evenodd"
          d="M2 0h3v2H2zM11 0h3v2h-3zM1 2h14v8H1zM3 10h10v1H3zM4 4h2v2H4zM10 4h2v2h-2zM7 7h2v1.5H7z"/>
  </g>
</svg>
